name: GA4 retrieval test
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test-ga4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/499034577424/locations/global/workloadIdentityPools/sanmaru-github/providers/github
          service_account: sanmaru-ga4-reader@sanmaru-analytics.iam.gserviceaccount.com
      - name: Install dependencies
        run: pip install -r requirements-ga4.txt
      - name: Test GA4 data retrieval
        env:
          GA4_PROPERTY_ID: '559934517'
        run: python scripts/fetch_ga4.py
