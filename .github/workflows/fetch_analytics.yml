name: GA4 to Sheets

on:
  workflow_dispatch:
    inputs:
      save_to_sheets:
        description: 'Save data to Google Sheets (unchecked = read-only test)'
        type: boolean
        required: true
        default: false
  schedule:
    # UTC: 0 22 * * * (JST = next day 07:00)
    - cron: '0 22 * * *'

permissions:
  contents: read
  id-token: write

concurrency:
  group: ga4-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  fetch-ga4:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Authenticate to Google Cloud (OIDC)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/499034577424/locations/global/workloadIdentityPools/sanmaru-github/providers/github
          service_account: sanmaru-ga4-reader@sanmaru-analytics.iam.gserviceaccount.com
      - name: Install dependencies
        run: pip install -r requirements-ga4.txt
      - name: Retrieve GA4 data and optionally save to Sheets
        env:
          GA4_PROPERTY_ID: '559934517'
          SPREADSHEET_ID: '1wo77doBqWRfGlqh9JovH576BJq6eGfOc0PjTvKqJ-iw'
          SAVE_TO_SHEETS: ${{ github.event_name == 'schedule' || inputs.save_to_sheets }}
        run: |
          if [ "$SAVE_TO_SHEETS" = 'true' ]; then
            python scripts/fetch_ga4.py --write
          else
            python scripts/fetch_ga4.py
          fi
